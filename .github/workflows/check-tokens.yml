# Token check - dono YouTube channels ke refresh token kaam kar rahe hain ya nahi?
#
# Kaise chalao: repo -> Actions -> "check-tokens" (left side) -> "Run workflow".
# ~20 second me result aa jata hai: har channel ke liye OK / FAIL + reason.
#
# Ye sirf CHECK karta hai - kuch upload ya change nahi karta.
name: check-tokens

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      YT_CLIENT_ID:        ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET:    ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN:    ${{ secrets.YT_REFRESH_TOKEN }}
      YT_CLIENT_ID_2:      ${{ secrets.YT_CLIENT_ID_2 }}
      YT_CLIENT_SECRET_2:  ${{ secrets.YT_CLIENT_SECRET_2 }}
      YT_REFRESH_TOKEN_2:  ${{ secrets.YT_REFRESH_TOKEN_2 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: pip install --quiet requests

      - name: Check YouTube tokens (Channel 1 + Channel 2)
        run: python src/check_tokens.py
