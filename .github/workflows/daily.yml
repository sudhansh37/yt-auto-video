# Hindi Shorts Bot - scheduled publisher (Zack D. Films -> Hindi Shorts)
#
# Din me 4 baar publish (subah 8 baje se shaam 5 baje ke beech):
#   08:15 AM IST = 02:45 UTC
#   11:00 AM IST = 05:30 UTC
#   01:45 PM IST = 08:15 UTC
#   04:30 PM IST = 11:00 UTC
# TIME CHANGE KARNA HO TO niche cron lines edit karo (UTC me hota hai,
# IST se 5 ghante 30 minute peeche).

name: publish-short

on:
  schedule:
    - cron: "45 2 * * *"     # 08:15 AM IST
    - cron: "30 5 * * *"     # 11:00 AM IST
    - cron: "15 8 * * *"     # 01:45 PM IST
    - cron: "0 11 * * *"     # 04:30 PM IST
  workflow_dispatch:          # repo -> Actions -> manual "Run workflow" button bhi
    inputs:
      mode:
        description: "Video selection mode"
        required: false
        default: "mix"
        type: choice
        options: [mix, latest, random]

permissions:
  contents: write   # data/history.json commit karne ke liye

concurrency:
  group: publish-short
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Deno (yt-dlp ka JS runtime - bina iske YouTube formats missing hote hain)
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Install Python packages
        run: pip install --quiet -r requirements.txt

      - name: Run pipeline
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID:        ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET:    ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN:    ${{ secrets.YT_REFRESH_TOKEN }}
          YOUTUBE_COOKIES:     ${{ secrets.YOUTUBE_COOKIES }}
          HF_TOKEN:            ${{ secrets.HF_TOKEN }}
          ttsfree:             ${{ secrets.ttsfree }}
          VOICE: hi-IN-MadhurNeural
        run: python src/main.py "${{ github.event.inputs.mode || 'mix' }}"

      - name: Save history (duplicates avoid)
        run: |
          git config user.name  "shorts-bot"
          git config user.email "action@github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "No history change - skip commit"
          else
            git commit -m "chore: mark video as used [skip ci]"
            git push
          fi
