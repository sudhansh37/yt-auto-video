# ================= Hindi Shorts Bot - main config =================
# Secrets (repo me pehle se lage hain - Actions me):
#   GEMINI_API_KEY, YT_CLIENT_ID, YT_CLIENT_SECRET, YT_REFRESH_TOKEN,
#   YOUTUBE_COOKIES, HF_TOKEN, ttsfree (TTSFree.com ka apikey)
#
# DUSRA CHANNEL (optional) - bas ye 3 secrets add karo:
#   YT_CLIENT_ID_2, YT_CLIENT_SECRET_2, YT_REFRESH_TOKEN_2
# Dono channels pe roz 2-2 videos jayengi (alag-alag videos), same
# time pe: 10:00 AM aur 3:00 PM IST.
#
# GEMINI FALLBACK KEY (optional):
#   GEMINI_API_KEY_2 - pehle wale ka quota khatam ho to ye automatic
#   use hota hai (analysis + TTS dono me)

channel:
  # Source channel ke shorts ka page (saare shorts ki list yahan se milti hai)
  url: "https://www.youtube.com/@zackdfilms/shorts"
  # Kitne videos yaad rakhne hain (duplicate avoid karne ke liye)
  max_history: 300

# ---------------- Gemini (video analysis -> Hindi script) ----------------
gemini:
  model: "gemini-3.6-flash"       # primary model
  # 503 "high demand" aaye to ye fallback models automatic try hote hain:
  #   gemini-flash-latest, gemini-3.5-flash, gemini-2.5-flash
  # (analyzer.py me FALLBACK_MODELS dekho)

# ---------------- TTS (Hindi voice) ----------------
# provider: "gemini"    -> Google Gemini TTS (DEFAULT). GEMINI_API_KEY se chalta
#                          hai (already repo me). Natural voice, male default.
#                          Fail hone pe fallback chain: TTSFree -> IndicF5 ->
#                          Parler -> edge-tts (video kabhi fail nahi hoti)
# provider: "ttsfree"   -> TTSFree.com ka API (secret 'ttsfree' me apikey)
# provider: "indicf5"   -> AI4Bharat IndicF5 (HF space, free)
# provider: "edge_tts"   -> Microsoft Edge TTS (free, no key)
# provider: "custom_http"-> apna koi bhi TTS API (template niche)
tts:
  provider: "gemini"

  gemini:
    model: "gemini-2.5-flash-preview-tts"
    # Male:   Puck (energetic), Charon (informative), Fenrir (excitable), Orus (firm)
    # Female: Kore, Aoede, Leda, Zephyr
    voice: "Puck"
    style: "Say in an energetic, engaging and clear YouTube shorts narrator tone, speaking natural Hindi:"

  ttsfree:
    voice_service: "servicebin"   # "servicebin" ya "servicegoo"
    voice_id: "hi-IN"             # hi-IN = Madhur (male), hi-IN2 = Swara (female)
    voice_speed: "5"              # -100 se 100 (thoda tez = natural feel)
    voice_pitch: "0"              # -100 se 100

  indicf5:                        # FALLBACK 1 (free)
    # Voices: punjabi_female_happy (default), tamil_female_happy,
    # marathi_female_wiki, marathi_male_wiki, kannada_female_happy
    voice: "punjabi_female_happy"

  edge_tts:                        # LAST FALLBACK
    voice: "hi-IN-MadhurNeural"   # options: hi-IN-MadhurNeural, hi-IN-SwaraNeural, hi-IN-HemaNeural
    rate: "+12%"

  # APNA TTS API lagana ho to provider: "custom_http" karke yahan bharo:
  custom_http:
    method: "POST"
    endpoint: "https://your-tts-api.example.com/v1/tts"
    auth_header: "Bearer {{TTS_API_KEY}}"
    body:
      text: "{text}"
      voice: "hindi_female"
      audio_format: "mp3"
    response: "binary"

  sarvam:
    speaker: "meera"
    model: "bulbul-v2"
    speech_rate: 1.15

# ---------------- Video editing ----------------
effects:
  variants: [zoom_in, pan_up, pan_down, pan_left, pan_right, ken_burns]
  # Zoom/pan kitna strong ho (0.15 = halka, 0.28 = clearly visible, 0.40 = bahut zyada)
  zoom_amount: 0.30
  # Color grade
  saturation: 1.28     # vibrant colors
  contrast: 1.12       # punchy blacks
  brightness: 0.04     # thoda bright (0 = normal, 0.10 = kaafi bright)
  sharpen: 1.0         # sharpness / crisp look (0 = band, 1.5 = bahut sharp)
  video_speed: 1.12    # video thodi tez (1.0 = normal, 1.3 = bahut tez)
  bgm_volume: 0.10     # slow background music volume (0 = band, 0.20 = zyada)
  # preset: "medium"    # (optional) low-memory machine pe "ultrafast" + threads: 1
  # threads: 1          # GitHub Actions ke liye kuch nahi badalna

# NOTE: crop TOP se anchor hota hai (upar ka content safe, bottom ka hissa
# jahan English caption hota hai wo kat jata hai). Video band 3:4 (1080x1440)
# rehta hai, upar-neeche white canvas - Instagram-style look.

# ---------------- On-screen captions ----------------
captions:
  # "hinglish"  -> captions Roman letters me (jaise "aap dekh sakte hain")
  # "devanagari" -> captions Devanagari (Hindi) me
  language: "hinglish"

# ---------------- YouTube upload ----------------
youtube:
  privacy: "public"      # public / unlisted / private
  category_id: "27"      # 27 = Education
  tags: ["hindi facts", "shorts", "facts in hindi", "amazing facts", "viral facts"]
  # "AI use" disclosure - upload ke waqt hi Studio ka AI toggle automatically
  # Yes ho jata hai (containsSyntheticMedia). Band karna ho to false karo.
  ai_disclosure: true
